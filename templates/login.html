<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
</head>
<body>

<h2>ログイン</h2>

<form method="post">
  <div>
    <input
      type="email"
      name="email"
      placeholder="メールアドレス"
      required
    >
  </div>

  <div>
    <input
      type="password"
      name="password"
      placeholder="パスワード"
      required
    >
  </div>

  <button type="submit">ログイン</button>
</form>

<hr>
<a href="{{ url_for('login_google') }}">
  Googleでログイン
</a>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul style="color: red;">
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<hr>
<a href="/register">新規登録</a>

</body>
</html>
